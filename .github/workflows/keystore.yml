name: Generar llave de firma (una sola vez)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generar
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore rewapp.jks -alias rewapp -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=ReWapp"
          mkdir out
          mv rewapp.jks out/
          echo -n "$PASS" > out/password.txt
      - uses: actions/upload-artifact@v4
        with:
          name: llave-firma
          path: out/
