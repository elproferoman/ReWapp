name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Si existe el secreto KEYSTORE_B64 el APK se firma con la llave fija
      # (así las versiones nuevas se instalan encima de las anteriores).
      - name: Preparar llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rewapp.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/rewapp.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk ReWapp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReWapp-apk
          path: ReWapp.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReWapp build ${{ github.run_number }}
          files: ReWapp.apk
